<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Vault &bull; Upload Photos and Videos from the Event</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: '#F9F8F6',
                        creamDark: '#EFECE6',
                        burgundy: '#581845',
                        burgundyHover: '#401132',
                        sage: '#8A9A86',
                        sageHover: '#738370',
                        roseDust: '#D4B2A7',
                        uploadBtn: '#c9a0dc',
                        uploadBtnHover: '#b58cc8',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-cream text-stone-800 min-h-screen flex flex-col font-sans">

    <!-- Header / Navbar -->
    <header class="bg-white border-b border-stone-200 sticky top-0 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <img src="https://github.com/user-attachments/assets/637742dc-b7fa-494c-9a90-924e963304b6" alt="PamGen App Icon" class="w-10 h-10 rounded-xl object-cover shadow-md">
                <div>
                    <h1 class="text-2xl font-bold tracking-tight text-stone-900" style="font-family: 'Times New Roman', Times, serif;">PAMGEN2026</h1>
                </div>
            </div>
            <!-- Minimalist Header Upload Button -->
            <div class="relative">
                <input type="file" id="file-input" multiple accept="image/*,video/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" onchange="handleFileSelect(event)">
                <button class="text-stone-900 text-xs sm:text-sm font-medium px-4 py-2.5 rounded-xl shadow-sm transition flex items-center space-x-2" style="background-color: #c9a0dc;">
                    <i class="fa-solid fa-arrow-up-from-bracket"></i>
                    <span>Upload Photos and Videos</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full space-y-6">

        <!-- Upload Queue / Progress -->
        <div id="upload-queue" class="max-w-2xl mx-auto space-y-3 hidden">
            <h3 class="text-xs font-semibold uppercase tracking-wider text-stone-400">Upload Queue</h3>
            <div id="queue-list" class="space-y-2"></div>
        </div>

        <!-- Gallery Section -->
        <section class="space-y-6">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 border-b border-stone-200 pb-4">
                <div>
                    <h2 class="text-xl font-bold text-stone-900">Gallery</h2>
                </div>
                <!-- Filters -->
                <div class="flex items-center space-x-2">
                    <div class="inline-flex rounded-lg bg-stone-200 p-1 text-xs font-medium">
                        <button onclick="filterGallery('all')" id="filter-all" class="px-3 py-1.5 rounded-md bg-white text-stone-900 shadow-sm transition">All</button>
                        <button onclick="filterGallery('image')" id="filter-image" class="px-3 py-1.5 rounded-md text-stone-600 hover:text-stone-900 transition">Photos</button>
                        <button onclick="filterGallery('video')" id="filter-video" class="px-3 py-1.5 rounded-md text-stone-600 hover:text-stone-900 transition">Videos</button>
                    </div>
                </div>
            </div>

            <!-- Gallery Grid -->
            <div id="gallery-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <!-- Dynamic items will populate here -->
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="text-center py-16 hidden">
                <div class="w-16 h-16 mx-auto rounded-full bg-stone-100 flex items-center justify-center text-stone-400 text-2xl mb-3">
                    <i class="fa-solid fa-folder-open"></i>
                </div>
                <h3 class="text-base font-medium text-stone-700">No media found in bucket</h3>
                <p class="text-xs text-stone-400 mt-1">Upload files using the button above to see them appear here instantly.</p>
            </div>

            <!-- Loading State -->
            <div id="loading-state" class="text-center py-16">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-burgundy border-t-transparent mb-3"></div>
                <p class="text-sm text-stone-500">Connecting to Cloudflare R2 bucket...</p>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-stone-200 py-6 mt-12 text-center text-xs text-stone-400">
        <p>&copy; PamGen App</p>
    </footer>

    <!-- Media Preview Modal -->
    <div id="preview-modal" class="fixed inset-0 z-50 bg-stone-900/80 backdrop-blur-sm flex items-center justify-center p-4 hidden" onclick="closePreview(event)">
        <div class="bg-white rounded-2xl max-w-4xl w-full overflow-hidden shadow-2xl relative" onclick="event.stopPropagation()">
            <div class="p-4 border-b border-stone-200 flex items-center justify-between">
                <h3 id="modal-title" class="font-semibold text-stone-800 truncate">Media Preview</h3>
                <button onclick="closePreviewDirect()" class="w-8 h-8 rounded-full hover:bg-stone-100 flex items-center justify-center text-stone-500 transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="modal-body" class="bg-stone-950 flex items-center justify-center max-h-[70vh] overflow-hidden p-2">
                <!-- Preview element -->
            </div>
            <div class="p-4 bg-white border-t border-stone-200 flex items-center justify-end">
                <button onclick="closePreviewDirect()" class="px-4 py-2 rounded-lg bg-stone-100 hover:bg-stone-200 text-stone-700 text-sm font-medium transition">
                    Close
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // Hardcoded R2 Public URL and Worker Endpoint
        let r2Config = {
            publicUrl: 'https://pub-bea8c4084925441c9b1f3b934025ec8b.r2.dev',
            uploadApi: 'https://photoapp-worker.myboard.workers.dev'
        };

        let allMediaItems = [];
        let currentFilter = 'all';

        window.addEventListener('DOMContentLoaded', () => {
            loadGalleryFromR2();
        });

        // Handle File Selection and Upload
        function handleFileSelect(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            const queueContainer = document.getElementById('upload-queue');
            const queueList = document.getElementById('queue-list');
            queueContainer.classList.remove('hidden');

            Array.from(files).forEach((file) => {
                uploadSingleFile(file, queueList);
            });

            event.target.value = '';
        }

        async function uploadSingleFile(file, queueList) {
            const fileId = 'file-' + Math.random().toString(36).substring(2, 9);
            const isVideo = file.type.startsWith('video');
            
            const itemHTML = `
                <div id="${fileId}" class="flex items-center justify-between p-3 rounded-xl bg-stone-50 border border-stone-200 text-sm">
                    <div class="flex items-center space-x-3 truncate">
                        <div class="w-8 h-8 rounded-lg bg-burgundy/10 text-burgundy flex items-center justify-center flex-shrink-0">
                            <i class="fa-solid ${isVideo ? 'fa-video' : 'fa-image'}"></i>
                        </div>
                        <div class="truncate">
                            <p class="font-medium text-stone-800 truncate">${file.name}</p>
                            <p class="text-xs text-stone-400 file-status">Uploading to R2...</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-3">
                        <div class="w-24 bg-stone-200 rounded-full h-2 overflow-hidden">
                            <div class="progress-bar bg-burgundy h-full transition-all duration-300" style="width: 15%"></div>
                        </div>
                        <span class="percentage text-xs font-medium text-stone-500 w-9 text-right">15%</span>
                    </div>
                </div>
            `;
            queueList.insertAdjacentHTML('beforeend', itemHTML);
            const itemElement = document.getElementById(fileId);
            const progressBar = itemElement.querySelector('.progress-bar');
            const percentageText = itemElement.querySelector('.percentage');
            const statusText = itemElement.querySelector('.file-status');

            try {
                let fileUrl = `${r2Config.publicUrl}/${encodeURIComponent(file.name)}`;

                if (r2Config.uploadApi) {
                    const formData = new FormData();
                    formData.append('file', file);

                    const response = await fetch(`${r2Config.uploadApi.replace(/\/$/, '')}/upload`, {
                        method: 'POST',
                        body: formData
                    });

                    if (!response.ok) throw new Error('Upload failed');
                    const resData = await response.json();
                    fileUrl = resData.url || fileUrl;
                } else {
                    await new Promise(resolve => setTimeout(resolve, 1200));
                }

                // Register file in local shared sync for fallback or immediate view
                saveItemToSharedCatalog({
                    name: file.name,
                    url: fileUrl,
                    type: isVideo ? 'video' : 'image'
                });

                progressBar.style.width = '100%';
                percentageText.textContent = '100%';
                statusText.textContent = 'Saved to R2';
                statusText.className = 'text-xs text-sage font-medium';

                setTimeout(() => {
                    itemElement.remove();
                    if (queueList.children.length === 0) {
                        document.getElementById('upload-queue').classList.add('hidden');
                    }
                    loadGalleryFromR2();
                }, 1000);

            } catch (err) {
                console.error(err);
                statusText.textContent = 'Upload failed';
                statusText.className = 'text-xs text-red-500 font-medium';
                progressBar.className = 'progress-bar bg-red-500 h-full';
            }
        }

        function getSharedCatalogItems() {
            const saved = localStorage.getItem('r2_shared_media_vault');
            return saved ? JSON.parse(saved) : [];
        }

        function saveItemToSharedCatalog(newItem) {
            const items = getSharedCatalogItems();
            if (!items.some(i => i.name === newItem.name)) {
                items.unshift(newItem);
                localStorage.setItem('r2_shared_media_vault', JSON.stringify(items));
            }
        }

        async function loadGalleryFromR2() {
            const loadingState = document.getElementById('loading-state');
            const emptyState = document.getElementById('empty-state');
            const grid = document.getElementById('gallery-grid');

            loadingState.classList.remove('hidden');
            emptyState.classList.add('hidden');
            grid.innerHTML = '';

            try {
                let items = [];
                if (r2Config.uploadApi) {
                    try {
                        const res = await fetch(`${r2Config.uploadApi.replace(/\/$/, '')}/list`);
                        if (res.ok) {
                            items = await res.json();
                        } else {
                            items = getSharedCatalogItems();
                        }
                    } catch (e) {
                        items = getSharedCatalogItems();
                    }
                } else {
                    items = getSharedCatalogItems();
                }

                allMediaItems = items;
                renderGallery(currentFilter);
            } catch (err) {
                console.error(err);
                allMediaItems = getSharedCatalogItems();
                renderGallery(currentFilter);
            } finally {
                loadingState.classList.add('hidden');
            }
        }

        function renderGallery(filter) {
            const grid = document.getElementById('gallery-grid');
            const emptyState = document.getElementById('empty-state');
            grid.innerHTML = '';

            const filtered = allMediaItems.filter(item => {
                if (filter === 'all') return true;
                return item.type === filter;
            });

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            filtered.forEach(item => {
                const isVideo = item.type === 'video';
                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl overflow-hidden border border-stone-200 shadow-sm hover:shadow-md transition group flex flex-col';
                
                card.innerHTML = `
                    <div class="relative aspect-square bg-stone-100 overflow-hidden cursor-pointer" onclick="openPreview('${item.url}', '${item.name}', '${item.type}')">
                        ${isVideo ? `
                            <video src="${item.url}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" muted preload="metadata"></video>
                            <div class="absolute inset-0 bg-black/20 flex items-center justify-center">
                                <div class="w-12 h-12 rounded-full bg-burgundy/90 text-white flex items-center justify-center shadow-lg text-lg">
                                    <i class="fa-solid fa-play ml-0.5"></i>
                                </div>
                            </div>
                        ` : `
                            <img src="${item.url}" alt="${item.name}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" loading="lazy">
                        `}
                        <span class="absolute top-2 left-2 px-2 py-1 rounded bg-black/60 backdrop-blur-md text-[10px] font-medium text-white uppercase tracking-wider">
                            ${item.type}
                        </span>
                    </div>
                    <div class="p-3 flex items-center justify-between bg-white border-t border-stone-100">
                        <span class="text-xs font-medium text-stone-700 truncate max-w-[180px]" title="${item.name}">${item.name}</span>
                        <button onclick="openPreview('${item.url}', '${item.name}', '${item.type}')" class="text-stone-400 hover:text-burgundy transition p-1">
                            <i class="fa-solid fa-expand text-xs"></i>
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterGallery(type) {
            currentFilter = type;
            ['all', 'image', 'video'].forEach(t => {
                const btn = document.getElementById(`filter-${t}`);
                if (t === type) {
                    btn.className = 'px-3 py-1.5 rounded-md bg-white text-stone-900 shadow-sm transition';
                } else {
                    btn.className = 'px-3 py-1.5 rounded-md text-stone-600 hover:text-stone-900 transition';
                }
            });
            renderGallery(type);
        }

        // Preview Modal Controls
        function openPreview(url, name, type) {
            const modal = document.getElementById('preview-modal');
            const modalBody = document.getElementById('modal-body');
            const modalTitle = document.getElementById('modal-title');

            modalTitle.textContent = name;

            if (type === 'video') {
                modalBody.innerHTML = `<video src="${url}" controls autoplay class="max-h-[65vh] rounded-lg"></video>`;
            } else {
                modalBody.innerHTML = `<img src="${url}" alt="${name}" class="max-h-[65vh] object-contain rounded-lg">`;
            }

            modal.classList.remove('hidden');
        }

        function closePreview(e) {
            if (e.target.id === 'preview-modal') {
                closePreviewDirect();
            }
        }

        function closePreviewDirect() {
            const modal = document.getElementById('preview-modal');
            modal.classList.add('hidden');
            document.getElementById('modal-body').innerHTML = '';
        }
    </script>
</body>
</html>
